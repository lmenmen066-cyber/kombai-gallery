name: Dependabot auto-merge

# Runs in the base-branch workflow context (so its token has write access), but
# NEVER checks out or executes PR code — it only flips "auto-merge" on the PR.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Restrict to Dependabot-authored PRs only.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor/patch (majors left for review)
        # Skip version-major bumps and directory/other moves; a human reviews those.
        if: >-
          steps.meta.outputs.dependency-type != 'indirect:development' &&
          steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # --auto marks "merge when required checks are green"; the branch
        # protection requires Lint + Build, so nothing merges until CI is happy.
        run: gh pr merge --auto --squash "$PR_URL"
