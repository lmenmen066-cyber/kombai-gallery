name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Two independent named checks so a PR surfaces "lint" and "build" separately.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static prerender)
        # next/font/google + Turbopack occasionally fails to fetch the font in
        # CI (transient, not a code error) — retry a few times before failing.
        run: |
          for i in 1 2 3; do
            if npm run build; then exit 0; fi
            echo "build attempt $i failed (likely transient next/font fetch); retrying in 5s"
            sleep 5
          done
          echo "::error::build failed after 3 attempts"
          exit 1
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Contrast audit
        run: |
          node scripts/contrast-audit.mjs a11y-contrast-report.md
          # Fail the build if any text pair is a hard (< 3.0:1) contrast failure.
          if grep -qE "^Hard text failures \(<3\.0\): [1-9]" <(node scripts/contrast-audit.mjs /tmp/r.md); then
            echo "::error::WCAG hard contrast regression (< 3.0:1) detected"; exit 1;
          fi
