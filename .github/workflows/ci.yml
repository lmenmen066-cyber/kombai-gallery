name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Two independent named checks so a PR surfaces "lint" and "build" separately.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Unit tests (Vitest + coverage gate)
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static prerender)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Contrast audit
        run: |
          node scripts/contrast-audit.mjs a11y-contrast-report.md
          # Fail the build if any text pair is a hard (< 3.0:1) contrast failure.
          if grep -qE "^Hard text failures \(<3\.0\): [1-9]" <(node scripts/contrast-audit.mjs /tmp/r.md); then
            echo "::error::WCAG hard contrast regression (< 3.0:1) detected"; exit 1;
          fi

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # Browser download can transiently fail on the runner network.
        run: |
          for i in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "chromium install attempt $i failed; retrying"; sleep 8
          done
          echo "::error::could not install Chromium after 3 attempts"; exit 1

      - name: Run e2e smoke
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        # Job-level retry on top of Playwright's per-test retries: a transient
        # dev-server/infra flake re-runs the whole suite; a genuine failure still
        # exits non-zero (E2E is a required check).
        run: |
          for i in 1 2; do
            if npm run test:e2e; then exit 0; fi
            echo "e2e attempt $i failed; retrying in 10s"; sleep 10
          done
          echo "::error::e2e failed after 2 attempts"; exit 1

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
