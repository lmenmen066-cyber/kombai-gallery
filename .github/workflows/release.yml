name: Release

# Cut a release whenever a version tag (v*) is pushed. Tag locally with:
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (gate the tag on a real build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Contrast report
        run: node scripts/contrast-audit.mjs a11y-contrast-report.md

      - name: Enforce version consistency
        # The tag, package.json version, and CHANGELOG entry must agree — abort
        # the release otherwise (no mislabeled / undocumented releases).
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $TAG but package.json is $pkg (expected v$pkg)"; exit 1
          fi
          if ! grep -qE "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$tag]' section"; exit 1
          fi
          echo "OK: tag $TAG matches package.json ($pkg) and CHANGELOG."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets."
            gh release upload "$TAG" a11y-contrast-report.md CHANGELOG.md --clobber
          else
            gh release create "$TAG" a11y-contrast-report.md CHANGELOG.md \
              --title "$TAG" --generate-notes
          fi
